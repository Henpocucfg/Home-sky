[project]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
flake8 = "^7.2.0"
mypy = "^1.15.0"
isort = "^6.0.1"

[tool.black]
line-length = 119
exclude = '''
.git
.venv
'''

[tool.isort]
line_length = 119
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["src"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[tool.poetry]
name = "pythonproject4"
version = "0.1.0"
description = "Банковские маскировки карт и счетов"
authors = ["Your Name <you@example.com>"]
packages = [
    { include = "src", from = "." }
]

